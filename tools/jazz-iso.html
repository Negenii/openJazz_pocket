  Builds jazz.iso for the OpenJazz Pocket core from Jazz Jackrabbit files.
  A single self-contained file: no server, no network, no installed tools,
  nothing else from this repository. Open it in a browser and it works.

  Takes a game folder, a macOS .app bundle, or a macOS .pkg installer.

  The embedded typeface is Analogue OS by AbFarid, a recreation of the font
  Analogue OS uses on the Pocket, under the SIL Open Font License 1.1. Its
  full text is in LICENSES/OFL-1.1.txt, and the original lives at
  https://github.com/AbFarid/analogue-os-font
-->

  :root {
    /* Analogue OS draws on a 5px grid blown up by a whole number. */
    --scale: 3;
    --unit: calc(1px * var(--scale));
    --u: var(--unit);

    --type: calc(5px * var(--scale));

    --fg:  #ffffff;
    --bg:  #000000;
    --dim: #808080;
  }
  @media (max-width: 560px) { :root { --scale: 2; } }

  * { box-sizing: border-box; }

  /* Any display rule of ours outranks the browser's own [hidden] rule, and
     the buttons set one, so say it here or nothing hidden stays hidden. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Analogue", ui-monospace, Menlo, Consolas, monospace;
    font-size: var(--type);
    letter-spacing: 1px;
    line-height: 2;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 600px;
    margin: 0 auto;
    padding-inline: calc(var(--unit) * 6);
    padding-block: calc(var(--unit) * 14) calc(var(--unit) * 10);
    display: flex;
    flex-direction: column;
    gap: calc(var(--unit) * 8);
  }

  h1 {
    margin: 0;
    font-size: calc(var(--type) * 2);
    font-weight: normal;
    line-height: 1.4;
    letter-spacing: 2px;
  }

  #drop {
    border: var(--unit) dashed var(--dim);
    background: var(--bg);
    padding: calc(var(--unit) * 12) calc(var(--unit) * 6);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--unit) * 5);
  }
  #drop.hot { border-style: solid; border-color: var(--fg); }
  /* Out of sight but still taking up its room, so nothing below it moves. */
  #drop.gone { visibility: hidden; }

  .drop-title { font-size: calc(var(--type) * 1.4); line-height: 1.6; }
  .drop-note {
    margin: 0;
    color: var(--dim);
    max-width: 34ch;
    line-height: 1.8;
  }
  .drop-note b { font-weight: normal; color: var(--fg); }

  /* The pill of Analogue OS, measured off the real thing: 26 rows tall, ends
     ten steps wide, insets 9 7 5 4 3 2 2 1 1 0. The three copies differ only
     in step size. The sizes are written out rather than held in a variable:
     a variable inside a variable resolves where it is declared, not where it
     is used, so the step would never reach the element that needs it. */
  button {
    font: inherit;
    letter-spacing: inherit;
    color: var(--bg);
    background: var(--fg);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    padding: 0 28px;

  }
  button:hover:not(:disabled) { background: #d0d0d0; }
  button:disabled { background: var(--dim); cursor: default; }
  /* An outline would be cut away by the clip, so focus draws a ring inside. */
  button:focus-visible {
    outline: none;
    box-shadow: inset 0 0 0 var(--u) var(--bg);
  }

  .buttons { display: flex; gap: calc(var(--unit) * 4); flex-wrap: wrap; justify-content: center; }

  #stage { display: flex; flex-direction: column; gap: calc(var(--unit) * 4); }

  }

    background: var(--fg);

<body>

<div class="wrap">
  <header>
    <h1>Jazz ISO Builder</h1>
  </header>

  <section id="drop">
    <div class="drop-title">Drop it here</div>
    <p class="drop-note">
      A game folder, <b>Jazz Jackrabbit Collection.app</b>, or the
      <b>.pkg</b> installer. Any of the three, no unpacking needed.
    </p>
    <div class="buttons">
      <button type="button" id="pickBtn">Choose a folder</button>
      <button type="button" id="pkgBtn">Choose an installer</button>
    </div>
    <input type="file" id="picker" webkitdirectory directory multiple hidden>
    <input type="file" id="pkgPicker" accept=".pkg" hidden>
  </section>

  <section id="stage">
    <p class="status" id="status" hidden></p>
    <div class="meter" id="meter" hidden><div class="fill" id="fill"></div></div>
    <div id="results"></div>
  </section>

</div>

<script>
(() => {
  "use strict";

  const SECTOR = 2048;
  // What makes a folder a Jazz Jackrabbit folder: the three files every
  // release carries, plus at least one episode. Asking for LEVEL0.000 would
  // be asking for episode one, which Holiday Hare 95 does not have at all.
  const CORE_FILES = ["MENU.000", "FONTS.000", "PANEL.000"];
  const LEVEL_RE = /^LEVEL0\.(\d{3})$/;
  const MIN_RUN_MS = 1000;   // the meter always takes at least this long
  const CELLS = 40;          // the meter fills in whole cells, not smoothly

  const els = {
    drop: document.getElementById("drop"),
    status: document.getElementById("status"),
    meter: document.getElementById("meter"),
    fill: document.getElementById("fill"),
    results: document.getElementById("results"),
    pickBtn: document.getElementById("pickBtn"),
    picker: document.getElementById("picker"),
    pkgBtn: document.getElementById("pkgBtn"),
    pkgPicker: document.getElementById("pkgPicker"),
  };

  const say = (text, kind) => {
    els.status.hidden = false;
    els.status.textContent = text;
    els.status.className = "status" + (kind ? " " + kind : "");
  };
  const bytes = n => {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
  };
  const yieldToUI = () => new Promise(r => setTimeout(r, 0));

  /* ---------- reading what was dropped -------------------------------- */

  const MAX_FILES = 20000;
  const MAX_DEPTH = 8;

  function readAllEntries(reader) {
    // readEntries hands back a batch at a time and signals the end with [].
    return new Promise((resolve, reject) => {
      const all = [];
      const pump = () => reader.readEntries(batch => {
        if (!batch.length) return resolve(all);
        all.push(...batch);
        pump();
      }, reject);
      pump();
    });
  }

  async function walkEntry(entry, dir, out, depth) {
    if (out.length >= MAX_FILES || depth > MAX_DEPTH) return;
    if (entry.name.startsWith(".") || entry.name === "__MACOSX") return;
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej));
      out.push({ dir, name: entry.name, size: file.size,
                 read: async () => new Uint8Array(await file.arrayBuffer()) });
      return;
    }
    if (entry.isDirectory) {
      const kids = await readAllEntries(entry.createReader());
      const sub = dir ? dir + "/" + entry.name : entry.name;
      for (const k of kids) await walkEntry(k, sub, out, depth + 1);
    }
  }

  function fromFileList(list) {
    const out = [];
    for (const file of list) {
      const rel = file.webkitRelativePath || file.name;
      const parts = rel.split("/");
      const name = parts.pop();
      if (name.startsWith(".") || parts.some(p => p.startsWith(".") || p === "__MACOSX")) continue;
      out.push({ dir: parts.join("/"), name, size: file.size,
                 read: async () => new Uint8Array(await file.arrayBuffer()) });
    }
    return out;
  }

  /* ---------- macOS installer packages --------------------------------- */

  // A .pkg is a xar archive: header, a compressed table of contents in XML,
  // then a heap of blobs. The game sits in one of those blobs, gzipped, as a
  // cpio archive. GOG puts it in "Scripts" rather than the usual "Payload",
  // so the blobs are sniffed by content instead of trusted by name.

  async function decompress(bytes, format) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  function looksGzip(b) { return b.length > 2 && b[0] === 0x1f && b[1] === 0x8b; }
  function looksZlib(b) {
    return b.length > 2 && (b[0] & 0x0f) === 8 && ((b[0] << 8 | b[1]) % 31) === 0;
  }
  function looksCpio(b) {
    if (b.length < 6) return false;
    const m = String.fromCharCode(b[0], b[1], b[2], b[3], b[4], b[5]);
    return m === "070707" || m === "070701" || m === "070702";
  }

  async function unwrap(bytes) {
    // Peel compression layers until something recognisable turns up.
    for (let i = 0; i < 3; i++) {
      if (looksCpio(bytes)) return bytes;
      if (looksGzip(bytes)) { bytes = await decompress(bytes, "gzip"); continue; }
      if (looksZlib(bytes)) { bytes = await decompress(bytes, "deflate"); continue; }
      break;
    }
    return bytes;
  }

  function parseCpio(buf) {
    const out = [];
    const txt = (o, n) => {
      let s = "";
      for (let i = 0; i < n; i++) s += String.fromCharCode(buf[o + i]);
      return s;
    };
    let off = 0;
    while (off + 6 <= buf.length) {
      const magic = txt(off, 6);
      let mode, size, nameLen, headerLen, pad;
      if (magic === "070707") {
        mode = parseInt(txt(off + 18, 6), 8);
        nameLen = parseInt(txt(off + 59, 6), 8);
        size = parseInt(txt(off + 65, 11), 8);
        headerLen = 76;
        pad = 0;
      } else if (magic === "070701" || magic === "070702") {
        mode = parseInt(txt(off + 14, 8), 16);
        size = parseInt(txt(off + 54, 8), 16);
        nameLen = parseInt(txt(off + 94, 8), 16);
        headerLen = 110;
        pad = 4;
      } else break;
      if (!isFinite(mode) || !isFinite(size) || !isFinite(nameLen)) break;
      const name = txt(off + headerLen, Math.max(0, nameLen - 1));
      let at = off + headerLen + nameLen;
      if (pad) at += (pad - (at % pad)) % pad;
      let end = at + size;
      if (pad) end += (pad - (end % pad)) % pad;
      off = end;
      if (name === "TRAILER!!!") break;
      if ((mode & 0o170000) === 0o100000) out.push({ path: name, size, at });
    }
    return out;
  }

  async function entriesFromPkg(file) {
    if (typeof DecompressionStream === "undefined") {
      throw new Error("this browser cannot open installers, try the game folder instead");
    }
    const raw = new Uint8Array(await file.arrayBuffer());
    const dv = new DataView(raw.buffer);
    if (String.fromCharCode(raw[0], raw[1], raw[2], raw[3]) !== "xar!") {
      throw new Error("that is not a macOS installer package");
    }
    const headerLen = dv.getUint16(4);
    const tocLen = Number(dv.getBigUint64(8));
    const heap = headerLen + tocLen;
    const tocXml = await decompress(raw.subarray(headerLen, heap), "deflate");
    const toc = new DOMParser().parseFromString(new TextDecoder().decode(tocXml), "application/xml");

    // Biggest blob first: the game is the bulk of any installer that holds it.
    const blobs = [...toc.querySelectorAll("file > data")].map(d => ({
      offset: Number(d.querySelector("offset").textContent),
      length: Number(d.querySelector("length").textContent),
    })).sort((a, b) => b.length - a.length);

    for (const blob of blobs) {
      if (blob.length < 65536) continue;
      let bytes;
      try {
        bytes = await unwrap(raw.subarray(heap + blob.offset, heap + blob.offset + blob.length));
      } catch (err) { continue; }
      if (!looksCpio(bytes)) continue;
      const files = parseCpio(bytes);
      if (!files.length) continue;
      return files.map(f => {
        const clean = f.path.replace(/^\.\//, "");
        const parts = clean.split("/");
        const name = parts.pop();
        return {
          dir: parts.join("/"),
          name,
          size: f.size,
          read: async () => bytes.subarray(f.at, f.at + f.size),
        };
      }).filter(e => !e.name.startsWith("."));
    }
    throw new Error("no game files inside that installer");
  }

  /* ---------- picking the folder that holds the game ------------------- */

  function findGames(entries) {
    const byDir = new Map();
    for (const e of entries) {
      if (!byDir.has(e.dir)) byDir.set(e.dir, []);
      byDir.get(e.dir).push(e);
    }
    const found = [];
    for (const [dir, files] of byDir) {
      const upper = new Map(files.map(f => [f.name.toUpperCase(), f]));
      if (!CORE_FILES.every(f => upper.has(f))) continue;
      const worlds = [...upper.keys()]
        .map(n => LEVEL_RE.exec(n))
        .filter(Boolean)
        .map(m => m[1]);
      if (!worlds.length) continue;
      found.push({
        dir, files, upper, worlds,
        main: worlds.includes("000"),
        depth: dir ? dir.split("/").length : 0,
      });
    }
    // The full game first, then whatever else came along, shallowest first.
    found.sort((a, b) => (b.main - a.main) || (a.depth - b.depth));
    for (const g of found) g.name = imageName(g);
    return found;
  }

  function imageName(game) {
    // The core mounts whatever the instance JSON points at, so the name is
    // what tells the two entries in the Pocket's list apart.
    if (game.main) return "jazz.iso";
    if (game.worlds.includes("050")) return "hh95.iso";
    const leaf = (game.dir.split("/").pop() || "game").toLowerCase().replace(/[^a-z0-9]+/g, "");
    return (leaf || "game") + ".iso";
  }

  /* ---------- ISO 9660 ------------------------------------------------- */

  function isoName(name) {
    let base = name, ext = "";
    const dot = name.lastIndexOf(".");
    if (dot > 0) { base = name.slice(0, dot); ext = name.slice(dot + 1); }
    const clean = s => s.toUpperCase().replace(/[^A-Z0-9_]/g, "_");
    base = clean(base).slice(0, 8) || "_";
    ext = clean(ext).slice(0, 3);
    return { base, ext, full: ext ? base + "." + ext : base };
  }

  function compareIso(a, b) {
    // Name field then extension, each padded with spaces, as ISO 9660 orders them.
    const pad = (s, n) => s.padEnd(n, " ");
    const w = Math.max(a.base.length, b.base.length);
    const x = Math.max(a.ext.length, b.ext.length);
    const an = pad(a.base, w), bn = pad(b.base, w);
    if (an !== bn) return an < bn ? -1 : 1;
    const ae = pad(a.ext, x), be = pad(b.ext, x);
    if (ae !== be) return ae < be ? -1 : 1;
    return 0;
  }

  function both32(dv, off, v) { dv.setUint32(off, v, true); dv.setUint32(off + 4, v, false); }
  function both16(dv, off, v) { dv.setUint16(off, v, true); dv.setUint16(off + 2, v, false); }

  function dirRecord(nameBytes, lba, size, isDir, when) {
    let len = 33 + nameBytes.length;
    if (len % 2) len++;
    const b = new Uint8Array(len);
    const dv = new DataView(b.buffer);
    b[0] = len;
    both32(dv, 2, lba);
    both32(dv, 10, size);
    b[18] = when.getUTCFullYear() - 1900;
    b[19] = when.getUTCMonth() + 1;
    b[20] = when.getUTCDate();
    b[21] = when.getUTCHours();
    b[22] = when.getUTCMinutes();
    b[23] = when.getUTCSeconds();
    b[24] = 0;
    b[25] = isDir ? 0x02 : 0x00;
    both16(dv, 28, 1);
    b[32] = nameBytes.length;
    b.set(nameBytes, 33);
    return b;
  }

  const ascii = s => Uint8Array.from(s, c => c.charCodeAt(0) & 0x7f);

  function writeStr(buf, off, text, len) {
    buf.set(ascii(text.padEnd(len, " ").slice(0, len)), off);
  }

  function dateString(when) {
    const p = (n, w) => String(n).padStart(w, "0");
    return p(when.getUTCFullYear(), 4) + p(when.getUTCMonth() + 1, 2) + p(when.getUTCDate(), 2) +
           p(when.getUTCHours(), 2) + p(when.getUTCMinutes(), 2) + p(when.getUTCSeconds(), 2) + "00";
  }

  async function buildIso(files, onProgress) {
    const when = new Date();

    // Name every entry first: mangling can collide, and the fix has to happen
    // before any offset is computed.
    const taken = new Set();
    const items = files.map(f => {
      let n = isoName(f.name);
      if (taken.has(n.full)) {
        for (let i = 1; i < 1000; i++) {
          const base = n.base.slice(0, 8 - String(i).length) + i;
          const cand = n.ext ? base + "." + n.ext : base;
          if (!taken.has(cand)) { n = { base, ext: n.ext, full: cand }; break; }
        }
      }
      taken.add(n.full);
      return { src: f, iso: n, size: f.size };
    });
    items.sort((a, b) => compareIso(a.iso, b.iso));

    // Root directory: "." and ".." first, then the files. A record may not
    // straddle a sector boundary, so lay the extent out once and keep the
    // offsets; the writing pass below reuses them.
    const dot = dirRecord(new Uint8Array([0]), 0, 0, true, when);
    const dotdot = dirRecord(new Uint8Array([1]), 0, 0, true, when);
    let pos = 0;
    const place = len => {
      if (Math.floor(pos / SECTOR) !== Math.floor((pos + len - 1) / SECTOR)) {
        pos = Math.ceil(pos / SECTOR) * SECTOR;
      }
      const at = pos;
      pos += len;
      return at;
    };
    const dotAt = place(dot.length);
    const dotdotAt = place(dotdot.length);
    for (const it of items) {
      it.recLen = 33 + it.iso.full.length + ((33 + it.iso.full.length) % 2);
      it.recAt = place(it.recLen);
    }
    const rootSectors = Math.max(1, Math.ceil(pos / SECTOR));

    const ROOT_LBA = 20;
    let lba = ROOT_LBA + rootSectors;
    for (const it of items) {
      it.lba = lba;
      lba += Math.ceil(it.size / SECTOR) || 1;
    }
    const totalSectors = lba;

    const image = new Uint8Array(totalSectors * SECTOR);
    const dv = new DataView(image.buffer);

    // Primary volume descriptor.
    const pvd = 16 * SECTOR;
    image[pvd] = 1;
    writeStr(image, pvd + 1, "CD001", 5);
    image[pvd + 6] = 1;
    writeStr(image, pvd + 8, "", 32);
    writeStr(image, pvd + 40, "JAZZ", 32);
    both32(dv, pvd + 80, totalSectors);
    both16(dv, pvd + 120, 1);
    both16(dv, pvd + 124, 1);
    both16(dv, pvd + 128, SECTOR);
    both32(dv, pvd + 132, 10);
    dv.setUint32(pvd + 140, 18, true);
    dv.setUint32(pvd + 148, 19, false);
    image.set(dirRecord(new Uint8Array([0]), ROOT_LBA, rootSectors * SECTOR, true, when), pvd + 156);
    for (const off of [190, 318, 446, 574]) writeStr(image, pvd + off, "", 128);
    for (const off of [702, 739, 776]) writeStr(image, pvd + off, "", 37);
    const stamp = dateString(when);
    for (const off of [813, 830, 847, 864]) writeStr(image, pvd + off, stamp, 16);
    image[pvd + 881] = 1;

    // Volume descriptor set terminator.
    image[17 * SECTOR] = 0xff;
    writeStr(image, 17 * SECTOR + 1, "CD001", 5);
    image[17 * SECTOR + 6] = 1;

    // Path tables, one little-endian and one big-endian, root only.
    const lpt = 18 * SECTOR, mpt = 19 * SECTOR;
    image[lpt] = 1; dv.setUint32(lpt + 2, ROOT_LBA, true); dv.setUint16(lpt + 6, 1, true);
    image[mpt] = 1; dv.setUint32(mpt + 2, ROOT_LBA, false); dv.setUint16(mpt + 6, 1, false);

    // Root directory extent, at the offsets computed above.
    const rootBase = ROOT_LBA * SECTOR;
    image.set(dot, rootBase + dotAt);
    image.set(dotdot, rootBase + dotdotAt);
    for (const it of items) {
      image.set(dirRecord(ascii(it.iso.full), it.lba, it.size, false, when), rootBase + it.recAt);
    }

    // File data.
    let done = 0;
    for (const it of items) {
      const buf = await it.src.read();
      image.set(buf, it.lba * SECTOR);
      done++;
      if (done % 25 === 0) { onProgress(done / items.length); await yieldToUI(); }
    }
    onProgress(1);
    return { image, items, totalSectors, rootSectors };
  }

  /* ---------- reading the result back ---------------------------------- */

  function inspectIso(image) {
    const dv = new DataView(image.buffer, image.byteOffset, image.byteLength);
    const tag = off => String.fromCharCode.apply(null, image.slice(off + 1, off + 6));
    let pvd = -1;
    for (let s = 16; s < 32; s++) {
      const off = s * SECTOR;
      if (off + SECTOR > image.length || tag(off) !== "CD001") break;
      if (image[off] === 1) { pvd = off; break; }
    }
    if (pvd < 0) return { ok: false, reason: "the finished image has no volume descriptor" };

    const label = String.fromCharCode.apply(null, image.slice(pvd + 40, pvd + 72)).trim();
    const rootLba = dv.getUint32(pvd + 158, true);
    const rootLen = dv.getUint32(pvd + 166, true);

    const files = [];
    const base = rootLba * SECTOR;
    let off = base;
    while (off < base + rootLen) {
      const len = image[off];
      if (len === 0) {
        off = base + (Math.floor((off - base) / SECTOR) + 1) * SECTOR;
        continue;
      }
      const size = dv.getUint32(off + 10, true);
      const flags = image[off + 25];
      const nlen = image[off + 32];
      const name = String.fromCharCode.apply(null, image.slice(off + 33, off + 33 + nlen));
      if (nlen > 1 && !(flags & 0x02)) files.push({ name: name.split(";")[0], size });
      off += len;
    }
    return { ok: true, label, files, sectors: dv.getUint32(pvd + 80, true) };
  }

  /* ---------- checking the finished image ------------------------------ */

  function verify(out) {
    const check = inspectIso(out.image);
    if (!check.ok) return check.reason;
    const byName = new Map(check.files.map(f => [f.name, f.size]));
    const missing = CORE_FILES.filter(r => !byName.has(r));
    if (missing.length) return "these are missing from the image: " + missing.join(", ");
    for (const it of out.items) {
      const got = byName.get(it.iso.full);
      if (got !== undefined && got !== it.size) return "wrong size in the image: " + it.iso.full;
    }
    if (check.files.length !== out.items.length) {
      return "packed " + out.items.length + " files but the image holds " + check.files.length;
    }
    return null;
  }

  /* ---------- one flow: take input, convert, offer the file ------------ */

  let busy = false;

  function reset() {
    els.results.textContent = "";
    els.meter.hidden = true;
    els.fill.style.width = "0%";
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // The work can finish in a blink, which reads as "nothing happened". Let the
  // meter take its time: it shows the lesser of real progress and elapsed time,
  // so it always travels the full width and never overstates the work.
  function runBar(getReal) {
    const started = performance.now();
    return new Promise(resolve => {
      const tick = () => {
        const elapsed = (performance.now() - started) / MIN_RUN_MS;
        const shown = Math.min(getReal(), elapsed);
        const pct = Math.round(shown * CELLS) / CELLS;
        // Below two cap widths the stepped ends would overlap into a blob.
        els.fill.style.width = pct <= 0 ? "0" : "max(" + (pct * 100) + "%, 20px)";
        if (shown >= 1) return resolve();
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  async function convert(entries, label) {
    const games = findGames(entries);
    if (!games.length) {
      say("No Jazz Jackrabbit files in " + label + ". Looked through " +
          entries.length + " files for " + CORE_FILES.join(", ") +
          " next to a LEVEL0 file.", "error");
      return false;
    }

    const total = games.reduce((n, g) => n + g.files.length, 0);
    let packed = 0, real = 0;
    els.meter.hidden = false;
    say(games.length > 1
      ? "Building " + games.length + " images from " + total + " files..."
      : "Building the image from " + total + " files...");

    const build = (async () => {
      const made = [];
      for (const game of games) {
        const share = game.files.length / total;
        const done = packed;
        const out = await buildIso(game.files, f => { real = done + f * share; });
        packed = done + share;
        const problem = verify(out);
        if (problem) throw new Error(problem);
        made.push({ game, out });
      }
      return made;
    })();

    const [made] = await Promise.all([build, runBar(() => real)]);

    say("Done!", "done");
    for (const { game, out } of made) offer(game.name, out.image);
    return true;
  }

  function offer(filename, image) {
    const line = el("p", "facts", filename + " · " + bytes(image.length));
    const button = el("button", null, "Download " + filename);
    button.type = "button";
    button.className = "save";
    button.addEventListener("click", () => {
      const url = URL.createObjectURL(new Blob([image], { type: "application/octet-stream" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    });
    els.results.append(line, button);
  }

  async function handle(job, label) {
    if (busy) return;
    busy = true;
    reset();
    els.drop.classList.add("gone");
    say("Reading " + label + "...");
    try {
      const ok = await convert(await job(), label);
      if (!ok) els.drop.classList.remove("gone");
    } catch (err) {
      els.drop.classList.remove("gone");
      say("Could not read " + label + ": " + (err && err.message || err), "error");
    } finally {
      busy = false;
    }
  }

  /* ---------- input ----------------------------------------------------- */

  function fromDrop(dt) {
    const dropped = [...dt.files];
    if (dropped.length === 1 && /\.pkg$/i.test(dropped[0].name)) {
      return { label: "the installer", job: () => entriesFromPkg(dropped[0]) };
    }
    const roots = [...dt.items]
      .map(i => i.webkitGetAsEntry && i.webkitGetAsEntry())
      .filter(Boolean);
    if (!roots.length) return null;
    return {
      label: roots.length === 1 ? "“" + roots[0].name + "”" : "what you dropped",
      job: async () => {
        const out = [];
        for (const r of roots) await walkEntry(r, "", out, 0);
        return out;
      },
    };
  }

  // The whole window takes drops: one, so a near miss still lands, and two,
  // because the zone goes invisible after a conversion and an invisible
  // element receives no events.
  window.addEventListener("dragover", e => {
    e.preventDefault();
    els.drop.classList.add("hot");
  });
  window.addEventListener("dragleave", e => {
    if (!e.relatedTarget) els.drop.classList.remove("hot");
  });
  window.addEventListener("drop", e => {
    e.preventDefault();
    els.drop.classList.remove("hot");
    const what = fromDrop(e.dataTransfer);
    if (!what) {
      say("This browser did not hand over the folder. Use the button instead.", "error");
      return;
    }
    handle(what.job, what.label);
  });

  els.pickBtn.addEventListener("click", () => els.picker.click());
  els.picker.addEventListener("change", () => {
    if (els.picker.files.length) handle(async () => fromFileList(els.picker.files), "the folder");
  });

  els.pkgBtn.addEventListener("click", () => els.pkgPicker.click());
  els.pkgPicker.addEventListener("change", () => {
    const f = els.pkgPicker.files[0];
    if (f) handle(() => entriesFromPkg(f), "the installer");
  });
})();
</script>
</body>
</html>
